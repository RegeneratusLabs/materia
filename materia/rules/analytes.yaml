# Canonical analyte catalog for the clinical engine.
#
# The lab report's own interval always wins. This catalog is the fallback when a report
# prints a value without a range, and the bridge that lets one rule speak about ferritin
# whether the lab printed ug/L, µg/L or ng/mL.
#
# `units` maps a printed unit to a factor: value_in_canonical = value * factor.
# `ref` is only used when the report has no interval; it is never used to overrule one.

