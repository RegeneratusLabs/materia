  name: Ferritin
  aliases: [ferritin, serum ferritin]
  unit: µg/L
  units: {µg/L: 1, ug/L: 1, ng/mL: 1, "ng/ml": 1}
  ref: {female: [13, 150], male: [30, 400]}
  ref_source: medlineplus-003490#005
  critical: {low: 5, high: 1000}

