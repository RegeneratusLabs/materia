      - when: {analyte: homocysteine, op: ">", value: 15, unit: µmol/L}
        weight: 0.10
        note: "A raised homocysteine supports folate deficiency."
    against: []
    confirm:
      - "Check B12 before treating folate; folate can mask B12 neuropathy."
      - "Assess diet and malabsorption (coeliac disease, alcohol)."
    citations: [medlineplus-003686#005, medlineplus-003686#006, medlineplus-000354#001]

