      any:
        - analyte: triglycerides
          op: ">"
          value: 1.7
          unit: mmol/L
    supporting:
      - when: {analyte: hdl, ref: low}
        weight: 0.08
        note: "Low HDL commonly accompanies high triglycerides."
      - when: {analyte: hba1c, op: ">", value: 5.6, unit: "%"}
        weight: 0.08
        note: "Dysglycaemia supports a metabolic cause."
      - when: {analyte: glucose, op: ">", value: 5.5, unit: mmol/L}
        weight: 0.05
        note: "Raised fasting glucose supports a metabolic cause."
    against: []
    severity_rules:
      - when: {analyte: triglycerides, op: ">", value: 5.6, unit: mmol/L}
        severity: high
        note: "Very high triglycerides: pancreatitis risk."
    confirm:
      - "Repeat fasting; check secondary causes (alcohol, thyroid, diabetes, kidney, medicines)."
      - "ApoB and the full lipid panel give a better risk picture than triglycerides alone."
    citations: [medlineplus-003493#005, medlineplus-003493#006, medlineplus-007812#005]

  - id: magnesium_low
