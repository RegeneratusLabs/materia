# Clinical patterns: deterministic, cited, and deliberately conservative.
#
# A pattern is a hypothesis, not a diagnosis. The engine only says "these findings fit
# this pattern"; it never turns a lab value into a disease label without confirmation.
#
# Criteria language:
#   analyte: canonical id from rules/analytes.yaml
#   op: "<", "<=", ">", ">=", "=="
#   value + unit: absolute threshold
#   ref: low|high: compare with the lab's own interval (or the catalog fallback)
#   any/all/not: boolean groups
#
# `supporting` and `against` add or subtract confidence. A citation must support the
# claim it is attached to; the test suite checks that each cited chunk exists.

patterns:
  - id: iron_deficiency
    label: Iron deficiency pattern
    category: nutrient
    severity: moderate
    base_confidence: 0.62
    when:
      any:
        - analyte: ferritin
          op: "<"
          value: 30
          unit: µg/L
        - all:
            - analyte: ferritin
              op: "<"
              value: 50
              unit: µg/L
            - analyte: transferrin_saturation
              op: "<"
              value: 20
              unit: "%"
    supporting:
      - when: {analyte: haemoglobin, ref: low}
        weight: 0.12
        note: "Anaemia supports iron deficiency but is not required."
      - when: {analyte: mcv, ref: low}
        weight: 0.08
        note: "Microcytosis supports iron deficiency."
      - when: {analyte: tibc, op: ">", value: 70, unit: µmol/L}
        weight: 0.05
        note: "A raised TIBC is consistent with iron deficiency."
    against:
      - when: {analyte: crp, op: ">", value: 5, unit: mg/L}
        weight: 0.25
        note: "Inflammation raises ferritin; the threshold may understate deficiency."
    severity_rules:
      - when: {analyte: haemoglobin, ref: low}
        severity: high
        note: "Iron deficiency with anaemia."
    confirm:
      - "Repeat ferritin and interpret it with CRP and the full blood count."
      - "Look for blood loss (menstrual, gastrointestinal) before supplementing."
      - "If ferritin is borderline, transferrin saturation and the blood count decide."
    citations: [pmc-pmc13449291#025, medlineplus-003490#006, medlineplus-003488#006]

  - id: b12_deficiency
    label: Vitamin B12 deficiency pattern
    category: nutrient
    severity: moderate
    base_confidence: 0.60
    when:
      any:
        - analyte: vitamin_b12
          op: "<"
          value: 219
          unit: pmol/L
        - all:
            - analyte: vitamin_b12
              op: "<"
              value: 300
              unit: pmol/L
            - analyte: mcv
              ref: high
        - analyte: methylmalonic_acid
          op: ">"
          value: 270
          unit: nmol/L
    supporting:
      - when: {analyte: mcv, ref: high}
        weight: 0.12
        note: "Macrocytosis is consistent with B12 deficiency."
      - when: {analyte: homocysteine, op: ">", value: 15, unit: µmol/L}
        weight: 0.10
        note: "A raised homocysteine supports B12 deficiency."
    against:
      - when: {analyte: creatinine, op: ">", value: 120, unit: µmol/L}
        weight: 0.10
        note: "Renal impairment can raise methylmalonic acid independently of B12."
    confirm:
      - "Confirm with methylmalonic acid (and homocysteine) before treating."
      - "Check for pernicious anaemia and malabsorption if deficiency is confirmed."
      - "Do not give folate alone when B12 is low or untested."
    citations: [medlineplus-003705#006, pmc-pmc13634279#001]

