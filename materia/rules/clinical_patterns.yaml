        note: "Severe hypomagnesaemia."
    confirm:
      - "Serum magnesium reflects a small fraction of body stores; interpret with symptoms, potassium, calcium and medicines such as PPIs or diuretics."
      - "Repeat and check kidney function before supplementing."
    citations: [medlineplus-003487#005, medlineplus-003487#006]

