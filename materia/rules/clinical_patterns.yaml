  - id: liver_enzyme_elevation
    label: Liver enzyme elevation
    category: liver
    severity: moderate
    base_confidence: 0.55
    when:
      any:
        - analyte: alt
          ref: high
        - analyte: ast
          ref: high
        - analyte: ggt
          ref: high
    supporting:
      - when: {analyte: alt, ref: high}
        weight: 0.05
        note: "ALT is the more liver-specific aminotransferase."
      - when: {analyte: ggt, ref: high}
        weight: 0.05
        note: "GGT supports a hepatobiliary cause."
      - when: {analyte: bilirubin, ref: high}
        weight: 0.10
        note: "Raised bilirubin adds concern."
    against: []
    severity_rules:
      - when: {analyte: bilirubin, ref: high}
        severity: high
        note: "Enzyme elevation with raised bilirubin."
    confirm:
      - "Repeat the panel after 2–4 weeks; a single value is not a diagnosis."
      - "Review alcohol, medicines, supplements, viral hepatitis and metabolic risk."
      - "Image the liver if elevation persists; do not attribute it to a supplement without evidence."
    citations: [medlineplus-003473#006, medlineplus-003472#006, medlineplus-003458#006]

  - id: high_triglycerides
