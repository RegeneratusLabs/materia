      - "Review medicines, pregnancy and iodine intake before supplementing."
    citations: [medlineplus-003684#006, medlineplus-003517#006]

  - id: dysglycaemia
    label: Dysglycaemia pattern
    category: metabolic
    severity: moderate
    base_confidence: 0.58
    when:
      any:
        - analyte: hba1c
          op: ">="
          value: 5.7
          unit: "%"
        - analyte: glucose
          op: ">="
          value: 5.6
          unit: mmol/L
    supporting:
      - when: {analyte: triglycerides, op: ">", value: 1.7, unit: mmol/L}
        weight: 0.05
        note: "High triglycerides commonly accompany insulin resistance."
      - when: {analyte: hdl, ref: low}
        weight: 0.05
        note: "Low HDL commonly accompanies insulin resistance."
    against: []
    severity_rules:
      - when: {analyte: hba1c, op: ">=", value: 6.5, unit: "%"}
        severity: high
        note: "A1C in the diabetes range; needs clinical confirmation."
      - when: {analyte: glucose, op: ">=", value: 7.0, unit: mmol/L}
        severity: high
        note: "Fasting glucose in the diabetes range; needs clinical confirmation."
    confirm:
      - "Repeat A1C or fasting glucose; two abnormal results are needed for a diabetes diagnosis."
      - "Consider an oral glucose tolerance test and assess cardiovascular and kidney risk."
    citations: [medlineplus-003640#005, medlineplus-003640#006]

