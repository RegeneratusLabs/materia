    intervention: Milk thistle (silymarin)
    kind: herb
    goal: Support liver function while the cause of enzyme elevation is investigated.
    grade: C
    rank_hint: 0.6
    dose:
      chunk: hc-nhpid-milk-thistle-oral#004
      quote: "140 - 600 milligrams of silymarin (calculated as silibin/silybin), per day"
      text: "140–600 mg silymarin/day"
      note: "Regulatory monograph dose; clinical trial evidence for liver enzymes is conflicting or limited."
    evidence:
      - hc-nhpid-milk-thistle-oral#004
      - nccih-milk-thistle#004
      - nccih-milk-thistle#005
    monitoring:
      text: "Repeat liver enzymes after 4–8 weeks; stop if enzymes rise or new symptoms appear."
      chunk: medlineplus-003473#006
    safety:
      veto_contexts: [ragweed_allergy]
      flag_contexts: [pregnancy, breastfeeding, anticoagulant, surgery, child]
      flag_if:
        - when: {analyte: inr, op: ">", value: 3.0, unit: ratio}
          label: "raised INR"
        - when: {analyte: platelets, ref: low}
          label: "low platelets"
      notes:
        - text: "Clinical trials in liver disease have been conflicting or too limited to conclude benefit; this is not a substitute for investigating the cause."
          chunk: nccih-milk-thistle#004
        - text: "Milk thistle is generally well tolerated; the most common effects are bloating, nausea and gas."
          chunk: nccih-milk-thistle#005

