# Recommendation graph: pattern -> intervention -> cited dose, monitoring, safety.
#
# Every option is an edge with a source. The model does not invent options; it can explain
# them. `dose.quote` and every number in `dose.text` must be a substring of the cited
# chunk, or the rule is withheld (tests enforce this).
#
# grade: A = guideline/regulatory + consistent trials; B = regulatory + supportive trials;
#        C = traditional/limited/conflicting evidence. The grade is shown, never hidden.

recommendations:
  - id: oral-iron-alternate-day
    pattern: iron_deficiency
    intervention: Oral iron
    kind: nutrient
    goal: Restore iron stores and improve fatigue or anaemia.
    grade: B
    rank_hint: 1.0
    dose:
      chunk: pmc-pmc13449291#030
      quote: "60-120 mg elemental iron on alternate days"
      text: "60–120 mg elemental iron on alternate days"
      note: "The review describes alternate-day dosing as a strategy that may optimise absorption and tolerability."
    evidence:
      - pmc-pmc13449291#030
      - pmc-pmc13449291#035
      - medlineplus-003490#006
    monitoring:
      text: "Recheck ferritin and haemoglobin 8–12 weeks after starting; treat toward ferritin above 50–100 ng/mL."
      chunk: pmc-pmc13449291#035
    safety:
      veto_contexts: [iron_overload]
      flag_contexts: [pregnancy, kidney_disease, child, ppi]
      flag_if:
        - when: {analyte: crp, op: ">", value: 5, unit: mg/L}
          label: "inflammation can raise ferritin; interpret with CRP"
      avoid_if:
        - {analyte: ferritin, op: ">", value: 300, unit: µg/L}
      notes:
        - text: "Gastrointestinal effects are the main barrier; lower-dose or alternate-day regimens improve tolerance."
          chunk: pmc-pmc13449291#031
        - text: "Chronic acid blockade can reduce the absorption of essential micronutrients, such as vitamin B12, magnesium, calcium, and iron."
          chunk: pmc-pmc13127095#001
        - text: "Taking iron away from tea, coffee, calcium-containing foods and antacids improves absorption."
          chunk: pmc-pmc13449291#031

  - id: oral-b12
    pattern: b12_deficiency
    intervention: Oral vitamin B12
    kind: nutrient
    goal: Correct B12 deficiency and prevent neurological progression.
    grade: B
    rank_hint: 1.0
    dose:
      chunk: pmc-pmc13634279#069
      quote: "2 mg of oral cyanocobalamin"
      text: "2 mg/day oral cyanocobalamin"
      note: "The systematic review found 2 mg/day oral cyanocobalamin as effective as monthly intramuscular 1 mg; methylcobalamin is an alternative."
    evidence:
      - pmc-pmc13634279#069
      - pmc-pmc13634279#076
      - medlineplus-003705#006
    monitoring:
      text: "Recheck B12 and methylmalonic acid after 8–12 weeks; confirm the cause if deficiency is proven."
      chunk: pmc-pmc13634279#069
    safety:
      veto_contexts: []
      flag_contexts: [pregnancy, breastfeeding, ppi, child]
      notes:
        - text: "Both oral and sublingual methylcobalamin 1,500 µg/day normalised B12 in about two-thirds of participants over three months."
          chunk: pmc-pmc13634279#076
        - text: "Chronic acid blockade can reduce the absorption of essential micronutrients, such as vitamin B12, magnesium, calcium, and iron."
          chunk: pmc-pmc13127095#001

  - id: vitamin-d3
    pattern: vitamin_d_insufficiency
    intervention: Vitamin D3 (cholecalciferol)
    kind: nutrient
    goal: Raise 25(OH)D into the sufficient range.
    grade: A
    rank_hint: 1.0
    dose:
      chunk: hc-nhpid-vitamin-d-hd#004
      quote: "25 µg (> 1,000 IU*)"
      text: "1,000–2,500 IU/day (25–62.5 µg)"
      note: "Health Canada's monograph sets 25–62.5 µg/day for adults; higher repletion doses need supervision."
    evidence:
      - hc-nhpid-vitamin-d-hd#004
      - pmc-pmc13363889#048
      - hc-nhpid-vitamin-d-hd#002
    monitoring:
      text: "Repeat 25(OH)D after 8–12 weeks; check calcium if the dose is high or kidney disease is present."
      chunk: pmc-pmc13363889#048
    safety:
      veto_contexts: [hypercalcaemia]
      flag_contexts: [kidney_disease, kidney_stones, pregnancy, child, thiazide]
      flag_if:
        - when: {analyte: egfr, op: "<", value: 60, unit: mL/min/1.73m2}
          label: "reduced eGFR"
      avoid_if:
        - {analyte: calcium, op: ">", value: 2.58, unit: mmol/L}
      notes:
        - text: "Take with an adequate intake of calcium."
          chunk: hc-nhpid-vitamin-d-hd#005
        - text: "Thiazide diuretics reduce urinary calcium excretion, increasing calcium reabsorption and hypercalcemia."
          chunk: pmc-pmc12423746#001

  - id: milk-thistle
