[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materia"
version = "1.0.0"
description = "Cited clinical decision-support and recommendation engine for naturopathic and integrative practitioners"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=2.0",
  "pillow>=10",
  "beautifulsoup4>=4.12",
  "pyyaml>=6",
]

[project.scripts]
materia = "materia.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["materia*"]

[tool.setuptools.package-data]
"materia" = ["rules/*.yaml"]
"materia.webapp" = [
  "static/*.html",
  "static/*.js",
  "static/assets/*.css",
  "static/assets/*.json",
  "static/assets/*.png",
  "static/assets/fonts/*.css",
  "static/assets/fonts/type/*.woff2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
