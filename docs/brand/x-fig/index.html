<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>materia — pipeline (X)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --paper:  #f5efdf;
    --ink:    #181818;
    --second: #6c6c60;
    --faint:  #b4b4a8;
    --rule:   #d8ccc0;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--paper); }

  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: var(--paper);
    color: var(--ink);
    padding: 100px;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    opacity: .05; mix-blend-mode: multiply;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--second);
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 100px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    margin-top: 24px;
  }

  /* ---------- the pipe ---------- */
  .pipe {
    position: relative;
    margin-top: 78px;
    padding-left: 80px;
    display: flex;
    flex-direction: column;
  }

  /* conduit */
  .pipe::before {
    content: "";
    position: absolute;
    left: 11px;
    top: 24px;
    bottom: 30px;
    width: 3px;
    background: var(--ink);
  }

  .step {
    position: relative;
    padding-bottom: 48px;
  }
  .step:last-child { padding-bottom: 0; }

  /* node sitting on the conduit */
  .step::before {
    content: "";
    position: absolute;
    left: -80px;
    top: 10px;
    width: 22px;
    height: 22px;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: var(--paper);
  }

  /* arrowhead entering each downstream node */
  .step + .step::after {
    content: "";
    position: absolute;
    left: 4px;
    top: -28px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 13px solid var(--ink);
  }

  .name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 42px;
    line-height: 1;
    letter-spacing: -0.025em;
  }

  .meta {
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--second);
  }

  .meta .dot { color: var(--faint); padding: 0 7px; }

  .lede {
    margin-top: 62px;
    max-width: 700px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 27px;
    line-height: 1.5;
    letter-spacing: -0.005em;
    color: var(--second);
  }

  .lede .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .foot {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--second);
  }

  .foot .tag { color: var(--faint); }
</style>
</head>
<body>
<div class="frame">

  <div class="kicker">materia / model stack</div>

  <h1>Read. Strip.<br>Reason.</h1>

  <div class="pipe">

    <div class="step">
      <div class="name">MiniCPM-OCR-1.0</div>
      <div class="meta">document<span class="dot">·</span>1.3B</div>
    </div>

    <div class="step">
      <div class="name">OpenMed PII</div>
      <div class="meta">identity<span class="dot">·</span>44M</div>
    </div>

    <div class="step">
      <div class="name">MiniCPM5-2B</div>
      <div class="meta">reasoning<span class="dot">·</span>2B</div>
    </div>

  </div>

  <p class="lede"><span class="brand">materia</span> helps practitioners and patients analyse their health data in a holistic and naturopathic way.</p>

  <div class="foot">
    <span>lab photo in · cited answer out</span>
    <span class="tag">on device</span>
  </div>

</div>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

</body>
</html>
