<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>materia — pipeline (X)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --paper:  #f5efdf;
    --ink:    #181818;
    --second: #6c6c60;
    --faint:  #b4b4a8;
    --rule:   #d8ccc0;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--paper); }

  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: var(--paper);
    color: var(--ink);
    padding: 100px;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* grain */
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    opacity: .05; mix-blend-mode: multiply;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--second);
    font-variant-numeric: tabular-nums;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    margin-top: 26px;
  }

  .stack {
    margin-top: 72px;
    border-top: 1px solid var(--rule);
  }

  .row {
    display: grid;
    grid-template-columns: 54px 1fr auto;
    align-items: baseline;
    gap: 0 22px;
    padding: 26px 0 24px;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }

  .idx {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
  }

  .who { display: flex; flex-direction: column; gap: 7px; }

  .name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.025em;
  }

  .role {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--second);
  }

  .spec {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    letter-spacing: .04em;
    color: var(--second);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* flow arrow in the gutter between rows */
  .row + .row::before {
    content: "↓";
    position: absolute;
    left: 18px;
    top: -13px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1;
    color: var(--faint);
    background: var(--paper);
    padding: 0 2px 2px;
  }

  .foot {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--second);
  }

  .foot .tag { color: var(--faint); }
</style>
</head>
<body>
<div class="frame">

  <div class="kicker">materia / model stack</div>

  <h1>Read. Strip.<br>Reason.</h1>

  <div class="stack">

    <div class="row">
      <div class="idx">01</div>
      <div class="who">
        <div class="name">MiniCPM-OCR-1.0</div>
        <div class="role">document</div>
      </div>
      <div class="spec">1.3B · 1.4 GB</div>
    </div>

    <div class="row">
      <div class="idx">02</div>
      <div class="who">
        <div class="name">OpenMed PII</div>
        <div class="role">identity</div>
      </div>
      <div class="spec">44M · 0.6 GB</div>
    </div>

    <div class="row">
      <div class="idx">03</div>
      <div class="who">
        <div class="name">MiniCPM5-2B</div>
        <div class="role">reasoning</div>
      </div>
      <div class="spec">2B · 2.8 GB</div>
    </div>

  </div>

  <div class="foot">
    <span>lab photo in · cited answer out</span>
    <span class="tag">on device</span>
  </div>

</div>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

</body>
</html>
